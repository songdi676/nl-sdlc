# 口径说明：本模板 quality/test 命令与插件 scripts/quality-gate.sh、scripts/run-tests.sh 的判定口径一致；
# 阈值配置见 templates/config/quality-gate.yaml，Java 覆盖率阈值需在 pom.xml 的 jacoco rules 配置，
# Vue 覆盖率阈值在 vitest 配置。
name: nl-sdlc pipeline
on:
  push: { branches: [main] }
  pull_request:
jobs:
  quality-backend:
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-17
    steps:
      - uses: actions/checkout@v4
      - run: mvn checkstyle:check spotbugs:check test jacoco:report jacoco:check
      - run: mvn dependency-check:check
  quality-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run lint && npx vue-tsc --noEmit && npx vitest run --coverage && npm audit --audit-level=high
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g newman && newman run tests/api/*.postman_collection.json --reporters cli,junit --reporter-junit-export build/test-results/newman/report.xml
  test-e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.40.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
  docker-build:
    needs: [quality-backend, quality-frontend, test-api, test-e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # 推送 GHCR 需 packages: write（GITHUB_TOKEN 默认无写包权限）
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 标签语义 {registry}/{project}:{version}-{commit}；本 job 仅在 main 触发（见 if），
      # 故 github.ref_name 必为 main 且不含 /；若放开到其他 ref，含 / 的 ref 名不能直接用作 tag
      - run: docker build -f templates/docker/Dockerfile.java -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }} .
      - run: docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ github.sha }}
      - run: docker build -f templates/docker/Dockerfile.vue -t ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}-${{ github.sha }} .
      - run: docker push ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}-${{ github.sha }}
